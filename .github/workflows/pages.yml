name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 工作流内的自动 GITHUB_TOKEN 需要 pages:write 才能开启并部署 Pages，
# 这样发布方的 PAT 就不必带 Pages 权限（只需 Contents 可写）。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # 仓库尚未开启 Pages 时自动开启

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .            # 仓库根目录就是站点根目录

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
